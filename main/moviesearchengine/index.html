        .back-button {

            left: 20px;
            z-index: 1000;
            background-color: #e50914;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .back-button:hover {
            background-color: #b2070f;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .back-button svg {
            margin-right: 5px;
        }
    </style>
